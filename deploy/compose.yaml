name: trailer-feed
services:
  api:
    container_name: trailer-feed-api
    image: trailer-feed-api:${RELEASE_SHA:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: /opt/trailer-feed/runtime.env
    environment:
      RELEASE_SHA: ${RELEASE_SHA:-local}
    ports:
      - "127.0.0.1:18100:18100"
    volumes:
      - trailer-feed-data:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  trailer-feed-data:
    name: trailer-feed-data
