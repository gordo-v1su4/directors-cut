generation_settings:
  model: Z_Image_Turbo_BF16
  images: 1
  steps: 9
  cfgscale: 1
  sampler: euler
  scheduler: beta
  sigmashift: 7
  negativeprompt: "blurry, low quality, distorted, watermark, text, bad anatomy, extra fingers"

character_sheets:
  - id: hermes_agent_builder_character
    name: Hermes Agent Builder Character Reference
    resolution: 1280x720
    save_as: outputs/youtube_workflow_image_sequence/00_character_hermes_builder.png
    seed: 610001
    prompt: "character reference sheet for a friendly AI systems builder named Hermes, young technical creator wearing a dark hoodie, laptop stickers, thoughtful expression, front view and three-quarter view, clean readable silhouette, cinematic production design, high detail, sharp focus, consistent character identity, no text"

place_backgrounds:
  - id: local_ai_studio_environment
    name: Local AI Studio Environment Reference
    resolution: 1280x720
    save_as: outputs/youtube_workflow_image_sequence/01_place_local_ai_studio.png
    seed: 610002
    prompt: "wide environment reference image of a cozy local AI video production studio, dual monitors showing node graphs, GPU workstation tower with subtle RGB, storyboard wall, cables and notes, warm practical lighting mixed with neon blue rim light, cinematic composition, high detail, sharp focus, no people, no text"

